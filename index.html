<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:#F7F2E8;color:#1C1410;min-height:100vh}
.anav{background:linear-gradient(90deg,#7A3B1E,#5C2B14);padding:10px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100;flex-wrap:wrap}
.abrand{color:#fff;font-size:15px;font-weight:500;font-family:Georgia,serif}
.anavl{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
.anb{background:transparent;border:none;border-radius:8px;padding:6px 10px;color:#fff;font-size:12px;opacity:.75;cursor:pointer;transition:all .2s}
.anb.on{background:rgba(255,255,255,.2);opacity:1}
.amain{max-width:820px;margin:0 auto;padding:20px 16px 60px}
.ahero{border-radius:16px;padding:34px 22px;color:#fff;text-align:center;margin-bottom:18px}
.ahero h1{font-size:24px;font-weight:500;font-family:Georgia,serif;margin-bottom:6px}
.ahero .su{font-size:10px;opacity:.7;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.ahero p{font-size:13.5px;opacity:.9;max-width:440px;margin:0 auto;line-height:1.65;font-family:Arial,sans-serif}
.acard{background:#FEFCF7;border:1px solid #E0D5C0;border-radius:12px;padding:18px 22px;margin-bottom:14px}
.agold{background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.28);border-radius:12px;padding:16px 20px;margin-bottom:14px}
.ltag{font-size:10px;letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:8px;font-family:Arial,sans-serif}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g2s{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qsb{border:none;border-radius:12px;padding:16px 13px;color:#fff;text-align:left;cursor:pointer;transition:opacity .15s;line-height:1.4}
.qsb:hover{opacity:.88}
.qsb .qe{font-size:24px;margin-bottom:6px}
.qsb .ql{font-size:13px;font-family:Georgia,serif;font-weight:500;margin-bottom:3px}
.qsb .qs2{font-size:11px;opacity:.8;font-family:Arial,sans-serif}
.ftile{border-radius:10px;padding:11px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pitem{display:flex;gap:10px;align-items:center}
.fw{perspective:1000px;cursor:pointer;width:100%}
.fi{position:relative;width:100%;transition:transform .52s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.fi.flipped{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;border-radius:12px}
.ff.bk{transform:rotateY(180deg);color:#fff}
.bdg{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 8px;border-radius:20px;font-weight:500;margin-bottom:7px;display:inline-block;font-family:Arial,sans-serif}
.bgait{background:rgba(122,59,30,.1);color:#7A3B1E}
.bcmd{background:rgba(28,74,90,.1);color:#1C4A5A}
.bpraise{background:rgba(201,168,76,.18);color:#8B6914}
.spk{background:none;border:1px solid #E0D5C0;border-radius:20px;padding:3px 9px;cursor:pointer;font-size:12px;color:#7A6955;transition:all .2s;font-family:Arial,sans-serif}
.spk:hover{background:#F0EBE0;color:#1C1410}
.catb{background:#FEFCF7;border:1px solid #E0D5C0;border-radius:12px;padding:13px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;width:100%;transition:background .15s}
.catb:hover{background:#F3EDE1}
.pt{background:#E0D5C0;border-radius:4px;height:4px;margin-bottom:18px}
.pf{height:100%;border-radius:4px;transition:width .3s}
.pill{border-radius:8px;padding:4px 9px;font-size:11px;cursor:pointer;transition:all .15s;font-family:Georgia,serif}
.qopt{border-radius:12px;padding:12px 10px;font-size:13px;font-family:Georgia,serif;text-align:center;cursor:pointer;border:1px solid #E0D5C0;background:#FEFCF7;color:#1C1410;transition:all .2s}
.qopt:hover:not(.ans){border-color:#7A3B1E;background:rgba(122,59,30,.05)}
.qopt.ok{background:#d4f4d4;border-color:#2a7a2a;color:#1a5c1a}
.qopt.no{background:#f4d4d4;border-color:#7a2a2a;color:#5c1a1a}
.qopt.ans{cursor:default}
.abtn{background:#7A3B1E;color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:13px;cursor:pointer;font-family:Arial,sans-serif;transition:opacity .15s}
.abtn:hover{opacity:.88}
.abtn:disabled{background:#E0D5C0;color:#999;cursor:default;opacity:1}

function shuf(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function gQ(){var c=shuf(ALL.slice()).slice(0,12);return c.map(function(cd){var o=ALL.filter(function(x){return x.en!==cd.en;});var w=shuf(o).slice(0,3).map(function(x){return x.en;});return Object.assign({},cd,{opts:shuf([cd.en].concat(w))});});}
function ex(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

load:function(){try{return{viewed:JSON.parse(localStorage.getItem('ucimo_v')||'[]'),qbest:parseInt(localStorage.getItem('ucimo_q')||'0'),barn:JSON.parse(localStorage.getItem('ucimo_b')||'[]')};}catch(e){return{viewed:[],qbest:0,barn:[]};}},
save:function(d){try{localStorage.setItem('ucimo_v',JSON.stringify(d.viewed));localStorage.setItem('ucimo_q',String(d.qbest));localStorage.setItem('ucimo_b',JSON.stringify(d.barn));}catch(e){}},
addCard:function(catId,idx){var d=P.load();var cat=CATS.find(function(c){return c.id===catId;});if(!cat||!cat.cards[idx])return;var k=catId+':'+cat.cards[idx].sc;if(d.viewed.indexOf(k)===-1)d.viewed.push(k);P.save(d);},
addBarn:function(sc){var d=P.load();if(d.barn.indexOf(sc)===-1)d.barn.push(sc);P.save(d);},
updateQuiz:function(s){var d=P.load();if(s>d.qbest){d.qbest=s;P.save(d);}},
reset:function(){try{localStorage.removeItem('ucimo_v');localStorage.removeItem('ucimo_q');localStorage.removeItem('ucimo_b');}catch(e){}},
badges:function(d){
var tc=CATS.find(function(c){return c.id==='travel';});
var dc=CATS.find(function(c){return c.id==='dressage';});
var td=tc&&tc.cards.every(function(c){return d.viewed.indexOf('travel:'+c.sc)!==-1;});
var dd=dc&&dc.cards.every(function(c){return d.viewed.indexOf('dressage:'+c.sc)!==-1;});
var e=[];
if(d.barn.length>=BARN.length)e.push('barn');
if(d.viewed.length>=10)e.push('words');
if(d.qbest>=10)e.push('quiz');
if(td)e.push('travel');
if(dd)e.push('dress');
return e;}
};

function rH(){return '<div style="position:relative;border-radius:16px;overflow:hidden;margin-bottom:18px;min-height:200px;background:linear-gradient(135deg,#7A3B1E,#5C2B14)"><img src="photos/dor-hero.jpeg" alt="Sasha and D\'Or at competition" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:25% center" onerror="this.hidden=true"><div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.08) 0%,rgba(20,8,2,.84) 58%)"></div><div class="ahero" style="background:transparent;position:relative;z-index:1;margin-bottom:0;border-radius:0;padding:18px 22px 26px;text-shadow:0 1px 5px rgba(0,0,0,.7)"><h1>Učimo Zajedno</h1><div class="su">Serbo-Croatian for Sasha, D\'Or, and George</div><p>This is the language connected to your great-grandfather George — and now, a language you can share with D\'Or.</p></div></div>'+rDailyWord()+'<div class="acard" style="border-left:3px solid '+C.gd+'"><span class="ltag" style="color:#8B6914">Your heritage</span><h2 style="font-size:17px;font-weight:500;font-family:Georgia,serif;margin:0 0 10px">George Ajduković — Your Great-Grandfather</h2><p style="font-size:13px;color:#7A6955;margin:0 0 12px;font-family:Arial,sans-serif;line-height:1.6">George left no recordings. But he left a language.</p><div class="tl"><div class="tli"><div class="tldot"></div><div class="tllbl">🏘️ Born December 7, 1923 — Oraovac, Lika</div><div class="tldesc">Born to Ilija and Janja Ajduković in a Serbian village in the mountains of what is now Croatia. <a href="https://maps.google.com/?q=Oraovac,Croatia" target="_blank" style="font-size:10.5px;color:#C9A84C;text-decoration:none;font-family:Arial,sans-serif;display:inline-block;margin-top:5px">📍 Oraovac on the map</a> His older sister Maria and younger brothers Andrew and Mecho grow up speaking this same language.<img src="photos/george-family-oraovac.jpeg" alt="George with mother Janja and siblings in Oraovac" style="width:100%;max-width:280px;border-radius:8px;margin-top:10px;display:block" onerror="this.hidden=true"><span style="font-size:10px;color:#aaa;font-family:Arial,sans-serif;font-style:italic;display:block;margin-top:4px">George with mother Janja and siblings in Oraovac</span><img src="photos/oraovac-house.jpeg" alt="The Ajduković house in Oraovac, now in ruins" style="width:100%;max-width:280px;border-radius:8px;margin-top:10px;display:block" onerror="this.hidden=true"><span style="font-size:10px;color:#aaa;font-family:Arial,sans-serif;font-style:italic;display:block;margin-top:4px">The Ajduković house in Oraovac, now in ruins</span></div></div><div class="tli"><div class="tldot"></div><div class="tllbl">🏫 School in Donji Lapac</div><div class="tldesc">The nearby town where he went to school — roads the family will one day walk together. <a href="https://maps.google.com/?q=Donji+Lapac,Croatia" target="_blank" style="font-size:10.5px;color:#C9A84C;text-decoration:none;font-family:Arial,sans-serif;display:inline-block;margin-top:5px">📍 Donji Lapac on the map</a></div></div><div class="tli"><div class="tldot"></div><div class="tllbl">💔 1933 — His father Ilija dies. George is nine.</div><div class="tldesc">Janja raises the family in Oraovac. Three years later, George will make the journey to America alone.<img src="photos/ilija-ajdukovic.jpeg" alt="Ilija Ajduković far right, father of George" style="width:100%;max-width:280px;border-radius:8px;margin-top:10px;display:block" onerror="this.hidden=true"><span style="font-size:10px;color:#aaa;font-family:Arial,sans-serif;font-style:italic;display:block;margin-top:4px">Ilija Ajduković (far right) — father of George</span></div></div><button class="tl-btn tl-expand" onclick="tlToggle()">Continue George\'s story ↓</button><button class="tl-btn tl-collapse" onclick="tlToggle()">← Show less</button><div class="tli tlx"><div class="tldot"></div><div class="tllbl">🚢 1936 — America, age 13</div><div class="tldesc">Comes alone to St. Maries, Idaho, to live with Uncle Andrew and Aunt Mary Ajduković. <a href="https://maps.google.com/?q=St+Maries,Idaho" target="_blank" style="font-size:10.5px;color:#C9A84C;text-decoration:none;font-family:Arial,sans-serif;display:inline-block;margin-top:5px">📍 St. Maries, Idaho</a> Ajduković becomes Kovich. The language travels with him.<img src="photos/uncle-andy-ajdukovic.jpeg" alt="Uncle Andrew Ajduković in St. Maries Idaho" style="width:100%;max-width:280px;border-radius:8px;margin-top:10px;display:block" onerror="this.hidden=true"><span style="font-size:10px;color:#aaa;font-family:Arial,sans-serif;font-style:italic;display:block;margin-top:4px">Uncle Andrew Ajduković — St. Maries, Idaho</span></div></div><div class="tli tlx"><div class="tldot"></div><div class="tllbl">🪖 WWII — Philippines, 11th Airborne Division</div><div class="tldesc">George serves as a US Army paratrooper. He parachutes onto the island of Luzon in the Philippines <a href="https://maps.google.com/?q=Luzon,Philippines" target="_blank" style="font-size:10.5px;color:#C9A84C;text-decoration:none;font-family:Arial,sans-serif;display:inline-block;margin-top:5px">📍 Luzon on the map</a> and is badly wounded in combat. A young man from Oraovac, fighting for the country that gave him a home.<img src="photos/george-11th-airborne.jpeg" alt="George Ajduković, 11th Airborne Division, US Army" style="width:100%;max-width:280px;border-radius:8px;margin-top:10px;display:block" onerror="this.hidden=true"><span style="font-size:10px;color:#aaa;font-family:Arial,sans-serif;font-style:italic;display:block;margin-top:4px">George Ajduković — 11th Airborne Division, US Army</span></div></div><div class="tli tlx"><div class="tldot"></div><div class="tllbl">💍 June 5, 1948 — Marries Betty Leuschel</div><div class="tldesc">He survived. He builds a life. Dave is born the following year in Moscow, Idaho — then Charlotte, Karen, Bob, and Kathy.<img src="photos/george-dave-aunt-mary.jpeg" alt="George with baby Dave and Aunt Mary Ajduković circa 1949" style="width:100%;max-width:280px;border-radius:8px;margin-top:10px;display:block" onerror="this.hidden=true"><span style="font-size:10px;color:#aaa;font-family:Arial,sans-serif;font-style:italic;display:block;margin-top:4px">George with baby Dave and Aunt Mary Ajduković — circa 1949</span></div></div><div class="tli tlx"><div class="tldot"></div><div class="tllbl">🌲 1955 — Career begins at Weyerhaeuser</div><div class="tldesc">Klamath Falls, Oregon. Then Eugene. Then Tacoma. Each transfer a step up.</div></div><div class="tli tlx"><div class="tldot"></div><div class="tllbl">🏢 1967 — Vice President, Weyerhaeuser HQ, Tacoma</div><div class="tldesc">From a mountain village to the corporate boardroom — through extraordinary hard work. <a href="https://maps.google.com/?q=Tacoma,Washington" target="_blank" style="font-size:10.5px;color:#C9A84C;text-decoration:none;font-family:Arial,sans-serif;display:inline-block;margin-top:5px">📍 Tacoma on the map</a></div></div><div class="tli tlx"><div class="tldot"></div><div class="tllbl">🌍 1971 — Returns to Yugoslavia</div><div class="tldesc">George travels back to Yugoslavia and reunites with family. <a href="https://maps.google.com/?q=Oraovac,Croatia" target="_blank" style="font-size:10.5px;color:#C9A84C;text-decoration:none;font-family:Arial,sans-serif;display:inline-block;margin-top:5px">📍 Oraovac on the map</a> Dave and his wife join him, traveling from Germany where Dave is stationed in the US Army.<img src="photos/george-mecho-1971.jpeg" alt="George with brother Mecho in Yugoslavia 1971" style="width:100%;max-width:280px;border-radius:8px;margin-top:10px;display:block" onerror="this.hidden=true"><span style="font-size:10px;color:#aaa;font-family:Arial,sans-serif;font-style:italic;display:block;margin-top:4px">George (left) with his brother Mecho — Yugoslavia, 1971</span></div></div><div class="tli tlx"><div class="tldot"></div><div class="tllbl">👶 December 24, 2013 — Meets Sasha</div><div class="tldesc">On Christmas Eve, George holds his great-granddaughter for the first time. Sasha is seven weeks old. Four generations in one photograph.<img src="photos/george-dave-jason-sasha-2013.jpeg" alt="George, Dave, Jason and baby Sasha, December 24 2013" style="width:100%;max-width:280px;border-radius:8px;margin-top:10px;display:block" onerror="this.hidden=true"><span style="font-size:10px;color:#aaa;font-family:Arial,sans-serif;font-style:italic;display:block;margin-top:4px">George, Dave, Jason, and Sasha — December 24, 2013</span></div></div><div class="tli tlx"><div class="tldot" style="background:#7A3B1E"></div><div class="tllbl">🐴 Right now, in the barn</div><div class="tldesc">You teach D\'Or George\'s words. His language finds a new home.</div></div></div></div></div>'+rLineage()+'<div class="acard" style="background:rgba(28,74,90,.04);border-color:rgba(28,74,90,.2);margin-bottom:14px"><span class="ltag" style="color:#1C4A5A">📖 About the language</span><p style="font-size:12.5px;line-height:1.75;color:#7A6955;margin:0;font-family:Arial,sans-serif">George was <strong style="color:#1C1410">Serbian</strong> and grew up in the Lika region, which is now part of Croatia. The language he spoke belongs to the South Slavic family that people today call Serbian, Croatian, Bosnian, or Montenegrin — depending on country and identity. This app uses the term <strong style="color:#1C1410">Serbo-Croatian</strong> in his honor, and the Latin alphabet so you can start reading and speaking right away.</p></div><div class="acard" style="margin-bottom:14px"><span class="ltag" style="color:'+C.pu+'">Your family\'s map</span><p style="font-size:10.5px;color:#aaa;font-family:Arial,sans-serif;margin:0 0 10px">Tap any place to open it on the map</p><div class="g2"><a href="https://maps.google.com/?q=Oraovac,Croatia" target="_blank" style="text-decoration:none;display:block"><div class="ftile" style="background:rgba(91,58,140,.08);border:1px solid rgba(91,58,140,.2)"><div style="font-weight:500;margin-bottom:3px;color:'+C.pu+';font-size:12px;font-family:Arial,sans-serif">🏘️ Oraovac, Lika</div><div style="font-size:11.5px;line-height:1.5;color:#7A6955;font-family:Arial,sans-serif">George\'s village in Croatia — where his story began</div></div></a><a href="https://maps.google.com/?q=Donji+Lapac,Croatia" target="_blank" style="text-decoration:none;display:block"><div class="ftile" style="background:rgba(28,74,90,.08);border:1px solid rgba(28,74,90,.2)"><div style="font-weight:500;margin-bottom:3px;color:'+C.tl+';font-size:12px;font-family:Arial,sans-serif">🏫 Donji Lapac</div><div style="font-size:11.5px;line-height:1.5;color:#7A6955;font-family:Arial,sans-serif">Where George went to school, also in Lika</div></div></a><a href="https://maps.google.com/?q=St+Maries,Idaho" target="_blank" style="text-decoration:none;display:block"><div class="ftile" style="background:rgba(122,59,30,.08);border:1px solid rgba(122,59,30,.2)"><div style="font-weight:500;margin-bottom:3px;color:'+C.ch+';font-size:12px;font-family:Arial,sans-serif">🇺🇸 St. Maries, Idaho</div><div style="font-size:11.5px;line-height:1.5;color:#7A6955;font-family:Arial,sans-serif">Where George arrived in 1936, age 13</div></div></a><a href="https://maps.google.com/?q=Tacoma,Washington" target="_blank" style="text-decoration:none;display:block"><div class="ftile" style="background:rgba(61,90,30,.08);border:1px solid rgba(61,90,30,.2)"><div style="font-weight:500;margin-bottom:3px;color:'+C.xc+';font-size:12px;font-family:Arial,sans-serif">🏢 Tacoma, Washington</div><div style="font-size:11.5px;line-height:1.5;color:#7A6955;font-family:Arial,sans-serif">Weyerhaeuser HQ — where George became VP in 1967</div></div></a><a href="https://maps.google.com/?q=Novi+Sad,Serbia" target="_blank" style="text-decoration:none;display:block"><div class="ftile" style="background:rgba(122,59,30,.08);border:1px solid rgba(122,59,30,.2)"><div style="font-weight:500;margin-bottom:3px;color:'+C.ch+';font-size:12px;font-family:Arial,sans-serif">🏙️ Novi Sad, Serbia</div><div style="font-size:11.5px;line-height:1.5;color:#7A6955;font-family:Arial,sans-serif">Dave\'s cousin and family live here today</div></div></a><a href="https://maps.google.com/?q=Ljubljana,Slovenia" target="_blank" style="text-decoration:none;display:block"><div class="ftile" style="background:rgba(61,90,30,.08);border:1px solid rgba(61,90,30,.2)"><div style="font-weight:500;margin-bottom:3px;color:'+C.xc+';font-size:12px;font-family:Arial,sans-serif">🏔️ Slovenia</div><div style="font-size:11.5px;line-height:1.5;color:#7A6955;font-family:Arial,sans-serif">Dave\'s nephew and niece — just across the border!</div></div></a></div></div><div class="agold"><span class="ltag" style="color:#8B6914">✨ D\'Or connection</span><p style="font-size:13px;line-height:1.7;color:#1C1410;margin:0;font-family:Arial,sans-serif">D\'Or is French for <strong>"of gold."</strong> In Serbo-Croatian, <strong>zlatna</strong> means golden. When you call her <em>Lijepa zlatna kobila!</em> (Beautiful golden mare!), you bridge two languages that both love her.</p></div><div class="g2" style="margin:14px 0"><button class="qsb" style="background:'+C.ch+'" onclick="go(\'dor\')"><div class="qe">🐴</div><div class="ql">D\'Or\'s Commands</div><div class="qs2">Gaits, commands &amp; praise</div></button><button class="qsb" style="background:'+C.tl+'" onclick="go(\'learn\')"><div class="qe">📚</div><div class="ql">Learn &amp; Explore</div><div class="qs2">8 categories, 100+ words</div></button><button class="qsb" style="background:'+C.pu+'" onclick="go(\'quiz\')"><div class="qe">❓</div><div class="ql">Quiz Mode</div><div class="qs2">Test your knowledge</div></button><button class="qsb" style="background:'+C.xc+'" onclick="go(\'tutor\')"><div class="qe">🤖</div><div class="ql">AI Tutor</div><div class="qs2">Copy prompts &amp; open Claude</div></button></div><div style="margin-top:8px"><button class="qsb" style="background:'+C.st+';width:100%" onclick="go(\'barn\')"><div class="qe">🌾</div><div class="ql">Barn Mode</div><div class="qs2">7 words for D\'Or — practice at the stable</div></button></div>'+rProgress()+'<div class="acard" style="margin-bottom:14px;background:rgba(28,74,90,.04);border-color:rgba(28,74,90,.2)"><span class="ltag" style="color:#1C4A5A">📱 Add to your iPhone home screen</span><p style="font-size:12.5px;color:#7A6955;margin:0 0 8px;font-family:Arial,sans-serif;line-height:1.7">In <strong style="color:#1C1410">Safari</strong>, tap the Share button then <strong style="color:#1C1410">Add to Home Screen</strong>. Učimo opens like an app — with D\'Or’s icon — no App Store needed.</p><p style="font-size:11px;color:#aaa;margin:0;font-family:Arial,sans-serif">Works on iPad too. On Mac: Safari → File → Add to Dock.</p></div><div class="acard" style="margin-bottom:14px"><span class="ltag" style="color:#7A6955">🔊 Special letters</span><p style="font-size:11.5px;color:#7A6955;margin:0 0 10px;font-family:Arial,sans-serif">Serbo-Croatian has letters that look different but sound familiar once you know them:</p><div class="pgrid"><div class="pitem"><div style="font-size:16px;color:'+C.ch+';font-weight:500;min-width:42px;font-family:Georgia,serif">Č č</div><div style="font-size:11.5px;color:#7A6955;font-family:Arial,sans-serif">= &quot;ch&quot; — church</div></div><div class="pitem"><div style="font-size:16px;color:'+C.ch+';font-weight:500;min-width:42px;font-family:Georgia,serif">Š š</div><div style="font-size:11.5px;color:#7A6955;font-family:Arial,sans-serif">= &quot;sh&quot; — shoe</div></div><div class="pitem"><div style="font-size:16px;color:'+C.ch+';font-weight:500;min-width:42px;font-family:Georgia,serif">Ž ž</div><div style="font-size:11.5px;color:#7A6955;font-family:Arial,sans-serif">= &quot;zh&quot; — measure</div></div><div class="pitem"><div style="font-size:16px;color:'+C.ch+';font-weight:500;min-width:42px;font-family:Georgia,serif">Đ đ</div><div style="font-size:11.5px;color:#7A6955;font-family:Arial,sans-serif">= &quot;j&quot; — jump
